[project]
name = "ors-render"
version = "0.1.0"
description = "Scene JSON to image renderer for OpenRackScreen"
requires-python = ">=3.11"
dependencies = ["ors-schema", "pillow>=10.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The bundled TTFs under src/ors_render/assets/ ship as package data; hatchling
# includes every file inside a declared package directory, so no force-include
# is needed (and adding one raises a duplicate-path error at build time).
packages = ["src/ors_render"]

[tool.uv.sources]
ors-schema = { workspace = true }
