[project]
name = "ors-server"
version = "0.2.0"
description = "OpenRackScreen server: owns the rack's config and pushes it to daemons"
requires-python = ">=3.11"
dependencies = [
    "ors-schema==0.2.0",
    "ors-render==0.2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
]

[project.scripts]
ors-server = "ors_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ors_server"]
# `artifacts`, not just `packages`. Hatchling honours .gitignore when selecting
# files, and `src/ors_server/web/` is gitignored precisely because it is a build
# output that would go stale the day it were committed. Without this line the
# wheel builds cleanly and ships no interface.
artifacts = ["src/ors_server/web/**"]

[tool.uv.sources]
ors-schema = { workspace = true }
ors-render = { workspace = true }
