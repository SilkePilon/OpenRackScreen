[project]
name = "ors-daemon"
version = "0.1.0"
description = "OpenRackScreen daemon: drives rack panels from a local config"
requires-python = ">=3.11"
dependencies = [
    "ors-schema",
    "ors-render",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[project.scripts]
ors-daemon = "ors_daemon.__main__:main"

[project.optional-dependencies]
# Pi-only: luma.lcd pulls the SPI/GPIO stack, which neither builds nor imports
# on x86 CI. Kept an *extra* rather than a plain dependency so `uv sync
# --all-packages` (what CI runs) leaves both unresolved-into-the-environment --
# extras are only installed under `--extra hardware` / `--all-extras`.
hardware = ["luma.lcd>=2.11", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ors_daemon"]

[tool.uv.sources]
ors-schema = { workspace = true }
ors-render = { workspace = true }
