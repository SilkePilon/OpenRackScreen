[project]
name = "ors-daemon"
version = "0.2.0"
description = "OpenRackScreen daemon: drives rack panels from a local config"
requires-python = ">=3.11"
dependencies = [
    "ors-schema==0.2.0",
    "ors-render==0.2.0",
    # The claim handover's X25519 + HKDF-SHA256 + AES-GCM (design spec S6.3
    # step 5): without it the minted daemon key would cross the LAN in
    # cleartext over plain HTTP. Already a server dependency, and floored at
    # 43 to match `server/pyproject.toml` rather than for any API this uses.
    # The workspace lock resolves 50.0.0, which publishes cp311-abi3 wheels
    # for `manylinux_2_17_aarch64`, `manylinux_2_28_aarch64`,
    # `manylinux_2_34_aarch64` and `manylinux_2_31_armv7l` -- checked, along
    # with its one dependency `cffi` 2.1.1 (cp311 `manylinux_2_17_aarch64`),
    # because a Rust toolchain is not something a Pi has and a source build of
    # this package needs one.
    "cryptography>=43.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    # For the link's blocking client. Floored at 13 because `websockets.sync`
    # arrived in 12 and settled in 13; the workspace lock resolves 17.0.1, which
    # publishes cp311 wheels for both `manylinux_2_17_aarch64` and
    # `manylinux_2_31_armv7l` -- checked, because `argon2-cffi-bindings` ships
    # no armv7l wheel at all and a source build on a Pi 3 is not acceptable.
    # There is nothing to build here in any case: the C extension is an optional
    # speedup with a pure-Python fallback.
    "websockets>=13.0",
    "zeroconf>=0.132",
]

[project.scripts]
ors-daemon = "ors_daemon.__main__:main"

[project.optional-dependencies]
# Pi-only: luma.lcd pulls the SPI/GPIO stack, which neither builds nor imports
# on x86 CI. Kept an *extra* rather than a plain dependency so `uv sync
# --all-packages` (what CI runs) leaves both unresolved-into-the-environment --
# extras are only installed under `--extra hardware` / `--all-extras`.
#
# `RPi.GPIO` and `spidev` are here because `luma.core` imports its GPIO backend
# lazily, inside the `spi()` constructor: without them the extra installs
# cleanly, `import luma.lcd` succeeds, and every panel then fails at open with
# `No module named 'RPi'`. Found on the rack, not in CI -- an x86 machine cannot
# tell the difference. Verified on a Pi 3B+ running Debian 13 (trixie).
hardware = ["luma.lcd>=2.11", "numpy>=1.26", "RPi.GPIO>=0.7.1", "spidev>=3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ors_daemon"]

[tool.uv.sources]
ors-schema = { workspace = true }
ors-render = { workspace = true }
