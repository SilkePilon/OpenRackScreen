[project]
name = "openrackscreen"
version = "0.1.0"
description = "Configurable monitoring displays for server racks"
requires-python = ">=3.11"
dependencies = ["ors-schema", "ors-render", "ors-daemon"]

[tool.uv]
package = false

[tool.uv.workspace]
# `daemon/` sits outside the `packages/*` glob, so it needs its own entry.
members = ["packages/*", "daemon"]

[tool.uv.sources]
ors-schema = { workspace = true }
ors-render = { workspace = true }
ors-daemon = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["packages/ors-schema/tests", "packages/ors-render/tests", "daemon/tests"]
# Three test directories, none of them a package, all of them holding files
# pytest has to import. Under the default `prepend` mode a module's name is its
# basename, so the first `test_config.py` imported takes that name and any
# second one is either skipped or shadowed -- across three trees that is a
# collision waiting for whoever adds the next obvious filename. `importlib`
# derives each module name from its full path instead, so basenames need not be
# unique across the workspace and no test directory needs an `__init__.py` to
# make itself distinct. There is no ini key for it -- `--import-mode` is
# command-line only.
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff >=0.16 formats fenced code blocks inside Markdown by default; docs/ holds
# planning prose with illustrative (non-authoritative) snippets, not source.
extend-exclude = ["docs/**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
